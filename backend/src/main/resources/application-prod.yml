# Production. Every secret comes from env vars. Nothing is mocked: payment defaults to
# "disabled" (cash on delivery only) until Razorpay keys are set.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

app:
  catalogue:
    # The server has no Excel folder; the catalogue is published from a laptop (see DEPLOYMENT.md).
    sync-on-startup: ${CATALOGUE_SYNC_ON_STARTUP:false}
    sync-cron: ${CATALOGUE_SYNC_CRON:-}
  payment:
    provider: ${PAYMENT_PROVIDER:disabled}
  shipping:
    provider: ${SHIPPING_PROVIDER:manual}
  storage:
    provider: ${STORAGE_PROVIDER:supabase}
  notifications:
    email: ${NOTIFY_EMAIL:brevo}
