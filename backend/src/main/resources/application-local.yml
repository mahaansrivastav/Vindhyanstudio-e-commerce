# Local development: zero setup. File-based H2 database in Postgres mode,
# all integrations mocked, emails/SMS/OTPs printed to the console.
spring:
  datasource:
    url: jdbc:h2:file:./data/db/vindhyan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  auth:
    expose-otp: true
